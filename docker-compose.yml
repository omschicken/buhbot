version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: casino
      POSTGRES_PASSWORD: casino_secret
      POSTGRES_DB: casino
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U casino"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  api-gateway:
    build:
      context: ./packages/api-gateway
    ports:
      - "3000:3000"
    environment:
      - PORT=3000
      - NODE_ENV=production
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  user-service:
    build:
      context: ./packages/user-service
    ports:
      - "3001:3001"
    environment:
      - PORT=3001
      - NODE_ENV=production
      - DATABASE_URL=postgresql://casino:casino_secret@postgres:5432/casino
      - REDIS_URL=redis://redis:6379
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  wallet-service:
    build:
      context: ./packages/wallet-service
    ports:
      - "3002:3002"
    environment:
      - PORT=3002
      - NODE_ENV=production
      - DATABASE_URL=postgresql://casino:casino_secret@postgres:5432/casino
      - REDIS_URL=redis://redis:6379
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  kyc-service:
    build:
      context: ./packages/kyc-service
    ports:
      - "3003:3003"
    environment:
      - PORT=3003
      - NODE_ENV=production
      - DATABASE_URL=postgresql://casino:casino_secret@postgres:5432/casino
    depends_on:
      postgres:
        condition: service_healthy

  provider-integration:
    build:
      context: ./packages/provider-integration
    ports:
      - "3004:3004"
    environment:
      - PORT=3004
      - NODE_ENV=production
      - REDIS_URL=redis://redis:6379
    depends_on:
      redis:
        condition: service_healthy

  bonus-engine:
    build:
      context: ./packages/bonus-engine
    ports:
      - "3005:3005"
    environment:
      - PORT=3005
      - NODE_ENV=production
      - DATABASE_URL=postgresql://casino:casino_secret@postgres:5432/casino
      - REDIS_URL=redis://redis:6379
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  affiliate-service:
    build:
      context: ./packages/affiliate-service
    ports:
      - "3006:3006"
    environment:
      - PORT=3006
      - NODE_ENV=production
      - DATABASE_URL=postgresql://casino:casino_secret@postgres:5432/casino
    depends_on:
      postgres:
        condition: service_healthy

  responsible-gambling:
    build:
      context: ./packages/responsible-gambling
    ports:
      - "3007:3007"
    environment:
      - PORT=3007
      - NODE_ENV=production
      - DATABASE_URL=postgresql://casino:casino_secret@postgres:5432/casino
      - REDIS_URL=redis://redis:6379
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

volumes:
  postgres_data:
